name: Inception Scan & Deploy
on:
  push:
    branches: [inception-disabled]
concurrency:
  group: inception-deploy
  cancel-in-progress: false
jobs:
  scan-deploy:
    runs-on: [self-hosted, inception]
    env:
      HOME: /root
    steps:
      - name: Scan + deploy (deploy.sh)
        run: bash /opt/blocks/code/blocks-os/scripts/deploy.sh
