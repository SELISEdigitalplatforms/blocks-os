<!DOCTYPE html>
<html lang="en" class="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Variant 3: Sidebar — Configure (Light)</title>
<style>
  :root {
    --font-sans: 'DM Sans', system-ui, -apple-system, sans-serif;
    --background: 0 0% 100%;
    --foreground: 222.2 84% 4.9%;
    --card: 0 0% 100%;
    --primary: 206 100% 35%;
    --primary-foreground: 210 40% 98%;
    --border: 214.3 31.8% 91.4%;
    --radius: 0.5rem;
    --high-emphasis: 0 0% 15%;
    --medium-emphasis: 0 0% 33%;
    --low-emphasis: 0 0% 62%;
    --muted-foreground: 215.4 16.3% 46.9%;
    --muted: 210 40% 96.1%;
    --success: 146 79% 44%;
    --destructive: 0 84.2% 60.2%;
    --surface-app: 220 33% 96%;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-sans); background: hsl(var(--surface-app)); color: hsl(var(--high-emphasis)); -webkit-font-smoothing: antialiased; line-height: 1.5; }
  .layout { display: flex; min-height: 100vh; }
  .sidebar { width: 240px; background: hsl(var(--card)); border-right: 1px solid hsl(var(--border)); padding: 24px 16px; flex-shrink: 0; }
  .sidebar-title { font-size: 12px; font-weight: 600; text-transform: uppercase; color: hsl(var(--low-emphasis)); letter-spacing: .5px; margin-bottom: 16px; padding: 0 12px; }
  .sidebar-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 6px; font-size: 14px; cursor: pointer; margin-bottom: 2px; color: hsl(var(--medium-emphasis)); }
  .sidebar-item.active { background: hsl(var(--muted)); color: hsl(var(--high-emphasis)); font-weight: 500; }
  .sidebar-item .dot { width: 6px; height: 6px; border-radius: 50%; }
  .main { flex: 1; padding: 24px 32px; overflow-y: auto; }
  h1 { font-size: 24px; font-weight: 600; margin-bottom: 24px; }
  .card { background: hsl(var(--card)); border: 1px solid hsl(var(--border)); border-radius: var(--radius); }
  .card-pad { padding: 24px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 24px; }
  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-label { font-size: 13px; color: hsl(var(--muted-foreground)); font-weight: 500; }
  .form-input { padding: 9px 12px; border: 1px solid hsl(var(--border)); border-radius: 6px; font-size: 14px; font-family: inherit; background: hsl(var(--background)); outline: none; color: hsl(var(--high-emphasis)); }
  .checkbox-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .checkbox-row input { width: 18px; height: 18px; accent-color: hsl(var(--primary)); }
  .btn-row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
  .btn { padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; font-family: inherit; }
  .btn-ghost { background: transparent; border: 1px solid hsl(var(--border)); color: hsl(var(--medium-emphasis)); }
  .btn-prime { background: hsl(var(--primary)); color: hsl(var(--primary-foreground)); border: 1px solid hsl(var(--primary)); }
  .section-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .section-head h3 { font-size: 18px; font-weight: 600; }
  .add-btn { display: flex; align-items: center; gap: 6px; padding: 7px 14px; background: transparent; border: 1px solid hsl(var(--border)); border-radius: 6px; font-size: 13px; color: hsl(var(--medium-emphasis)); cursor: pointer; font-family: inherit; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 10px 16px; font-weight: 600; color: hsl(var(--medium-emphasis)); font-size: 12px; text-transform: uppercase; letter-spacing: .4px; border-bottom: 1px solid hsl(var(--border)); }
  td { padding: 12px 16px; border-bottom: 1px solid hsl(var(--border)); }
  tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: hsl(var(--muted)); }
  .badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 500; }
  .badge-success { background: hsl(146 79% 44% / 0.1); color: hsl(var(--success)); }
  .mono { font-family: "SF Mono", Consolas, monospace; font-size: 13px; }
  .text-muted { color: hsl(var(--muted-foreground)); font-size: 13px; }
  .app-count { font-size: 12px; color: hsl(var(--low-emphasis)); padding: 0 16px 16px; }
</style>
</head>
<body>
<div class="layout">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-title">Configure</div>
    <div class="sidebar-item active">
      <span class="dot" style="background:hsl(var(--primary))"></span> Settings
    </div>
    <div class="sidebar-item" style="cursor:default">
      <span class="dot" style="background:transparent;border:1px solid hsl(var(--border))"></span> Applications
    </div>
  </div>

  <!-- Main Content -->
  <div class="main">
    <h1>User Configuration</h1>
    <div class="card">
      <div class="card-pad">
        <div class="form-grid">
          <div class="form-group"><label class="form-label">Account activation url</label><input class="form-input" value="https://dbaosi.dev.blocksdevelopers.com/activate" readonly></div>
          <div class="form-group"><label class="form-label">Account verification url</label><input class="form-input" value="https://dbaosi.dev.blocksdevelopers.com/verify" readonly></div>
          <div class="form-group"><label class="form-label">Recovery account URL</label><input class="form-input" value="https://dbaosi.dev.blocksdevelopers.com/resetpassword" readonly></div>
          <div class="form-group"><label class="form-label">Activation url lifetime (mins)</label><input class="form-input" value="1440" readonly></div>
          <div class="form-group"><label class="form-label">Recovery URL lifetime (mins)</label><input class="form-input" value="60" readonly></div>
          <div class="checkbox-row"><input type="checkbox" checked disabled><span class="text-muted">Logout on password change</span></div>
        </div>
        <div class="btn-row"><button class="btn btn-ghost">Reset</button><button class="btn btn-prime" disabled>Change</button></div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
